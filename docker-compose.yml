services:
  salesync-db:
    image: postgres:16
    container_name: salesync-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salesync
    ports:
      - '5433:5432'
    volumes:
      - salesync-db-data:/var/lib/postgresql/data

volumes:
  salesync-db-data:
